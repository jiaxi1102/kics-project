name: PR2 exact-horizon LARRY validation

on:
  push:
    branches: [temporary-pr2-larry-validation]
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

concurrency:
  group: pr2-larry-validation
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install numpy pandas scipy scikit-learn matplotlib
      - name: Run checksum-verified exact-horizon release analysis
        run: python tools/pr2_larry_runner_release.py --output pr2_results
      - name: Upload compact validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr2-larry-validation
          path: pr2_results
          if-no-files-found: error
          compression-level: 6
