name: Mine OEIS Open candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mine candidates unsolved by all published runs
        run: python open_problem_workbench/mine_unsolved.py
      - uses: actions/upload-artifact@v4
        with:
          name: unsolved-candidates
          path: open_problem_workbench/unsolved_candidates.json
          if-no-files-found: error
