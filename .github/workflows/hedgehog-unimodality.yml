name: Hedgehog unimodality Lean verification

on:
  push:
    branches:
      - lean-open-question-2026-08-31
    paths:
      - hedgehog_unimodality/**
      - .github/workflows/hedgehog-unimodality.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Elaborate, build, audit axioms, and independently kernel-check
        uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: "1"
        with:
          lake-package-directory: hedgehog_unimodality
          build: true
          test: false
          lint: false
          axiom-audit: true
          axiom-audit-root: Hedgehog
          nanoda: true
          nanoda-allow-sorry: false
