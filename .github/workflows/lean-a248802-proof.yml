name: Lean A248802 proof check

on:
  push:
    branches:
      - lean-proof/a248802-counterexample

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formal/a248802
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Download mathlib cache
        run: lake exe cache get
      - name: Reject unfinished proofs
        run: |
          if grep -nE '\b(sorry|admit)\b' A248802Counterexample.lean; then
            echo "Unfinished proof marker found"
            exit 1
          fi
      - name: Elaborate and kernel-check proof file
        run: lake env lean A248802Counterexample.lean
      - name: Build declared Lean target
        run: lake build A248802Counterexample
